<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .header {
            text-align: center;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 40px;
            color: #fff;
            font-size: 1.2em;
        }

        .stats div {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stats span {
            color: #00d9ff;
            font-weight: bold;
        }

        #gameCanvas {
            border: 4px solid #e94560;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
            background: #000;
        }

        .controls {
            color: #888;
            text-align: center;
            font-size: 0.9em;
        }

        .controls p {
            margin: 5px 0;
        }

        .controls span {
            color: #00d9ff;
            background: rgba(0, 217, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #e94560;
            box-shadow: 0 0 50px rgba(233, 69, 96, 0.5);
        }

        #startScreen h2, #gameOverScreen h2 {
            color: #e94560;
            font-size: 2em;
            margin-bottom: 20px;
        }

        #startScreen p, #gameOverScreen p {
            color: #fff;
            margin-bottom: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
        }

        #finalScore {
            color: #00d9ff;
            font-size: 2em;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🎮 坦克大战 🎮</h1>
        </div>

        <div class="stats">
            <div>分数: <span id="score">0</span></div>
            <div>生命: <span id="lives">3</span></div>
            <div>关卡: <span id="level">1</span></div>
            <div>敌人: <span id="enemies">0</span></div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="controls">
            <p><span>W A S D</span> 或 <span>方向键</span> 移动</p>
            <p><span>空格</span> 或 <span>J</span> 发射子弹</p>
        </div>
    </div>

    <div id="startScreen">
        <h2>🎮 坦克大战 🎮</h2>
        <p>经典FC游戏复刻版</p>
        <p>消灭所有敌人，保护你的基地！</p>
        <button class="btn" onclick="startGame()">开始游戏</button>
    </div>

    <div id="gameOverScreen" class="hidden">
        <h2>游戏结束</h2>
        <p>最终得分</p>
        <p id="finalScore">0</p>
        <button class="btn" onclick="restartGame()">重新开始</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 游戏状态
        let gameRunning = false;
        let score = 0;
        let lives = 3;
        let level = 1;

        // 地图元素
        const TILE_SIZE = 40;
        const COLS = 20;
        const ROWS = 15;

        // 地图数据: 0=空, 1=砖墙, 2=钢墙, 3=草地, 4=水, 5=基地
        let map = [];

        // 玩家坦克
        let player = {
            x: 400,
            y: 480,
            width: 36,
            height: 36,
            speed: 3,
            direction: 'up',
            color: '#00ff00',
            lastShot: 0,
            shootDelay: 300
        };

        // 敌人坦克
        let enemies = [];
        const MAX_ENEMIES = 4;
        let totalEnemies = 10;
        let spawnedEnemies = 0;

        // 子弹
        let bullets = [];

        // 爆炸效果
        let explosions = [];

        // 按键状态
        const keys = {};

        // 初始化地图
        function initMap() {
            map = [];
            for (let y = 0; y < ROWS; y++) {
                map[y] = [];
                for (let x = 0; x < COLS; x++) {
                    map[y][x] = 0;
                }
            }

            // 添加砖墙
            const brickPositions = [
                // 中间区域
                [5, 5], [6, 5], [7, 5], [8, 5], [9, 5],
                [5, 6], [9, 6],
                [5, 7], [6, 7], [7, 7], [8, 7], [9, 7],
                [10, 5], [11, 5], [12, 5], [13, 5], [14, 5],
                [14, 6], [14, 7],
                [10, 7], [11, 7], [12, 7], [13, 7],
                // 上方区域
                [3, 2], [4, 2], [15, 2], [16, 2],
                [7, 3], [8, 3], [11, 3], [12, 3],
                // 下方保护墙
                [8, 12], [9, 12], [10, 12], [11, 12],
                [8, 13], [11, 13],
            ];

            brickPositions.forEach(([x, y]) => {
                if (y < ROWS && x < COLS) {
                    map[y][x] = 1;
                }
            });

            // 添加钢墙
            const steelPositions = [
                [2, 5], [17, 5], [2, 8], [17, 8],
                [4, 10], [15, 10],
            ];

            steelPositions.forEach(([x, y]) => {
                if (y < ROWS && x < COLS) {
                    map[y][x] = 2;
                }
            });

            // 基地位置
            map[13][9] = 5;
            map[13][10] = 5;
            map[14][9] = 5;
            map[14][10] = 5;
        }

        // 绘制地图
        function drawMap() {
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const tile = map[y][x];
                    const px = x * TILE_SIZE;
                    const py = y * TILE_SIZE;

                    switch(tile) {
                        case 1: // 砖墙
                            ctx.fillStyle = '#8B4513';
                            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            ctx.strokeStyle = '#654321';
                            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
                            // 砖块纹理
                            ctx.beginPath();
                            ctx.moveTo(px, py + TILE_SIZE/2);
                            ctx.lineTo(px + TILE_SIZE, py + TILE_SIZE/2);
                            ctx.moveTo(px + TILE_SIZE/2, py);
                            ctx.lineTo(px + TILE_SIZE/2, py + TILE_SIZE/2);
                            ctx.moveTo(px + TILE_SIZE/2, py + TILE_SIZE/2);
                            ctx.lineTo(px + TILE_SIZE/2, py + TILE_SIZE);
                            ctx.stroke();
                            break;
                        case 2: // 钢墙
                            ctx.fillStyle = '#808080';
                            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#A0A0A0';
                            ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                            ctx.strokeStyle = '#606060';
                            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
                            break;
                        case 3: // 草地
                            ctx.fillStyle = '#228B22';
                            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            break;
                        case 4: // 水
                            ctx.fillStyle = '#1E90FF';
                            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            break;
                        case 5: // 基地
                            ctx.fillStyle = '#FFD700';
                            ctx.fillRect(px + 5, py + 5, TILE_SIZE - 10, TILE_SIZE - 10);
                            ctx.strokeStyle = '#FFA500';
                            ctx.lineWidth = 2;
                            ctx.strokeRect(px + 5, py + 5, TILE_SIZE - 10, TILE_SIZE - 10);
                            ctx.lineWidth = 1;
                            break;
                    }
                }
            }
        }

        // 绘制坦克
        function drawTank(tank, isPlayer = false) {
            ctx.save();
            ctx.translate(tank.x + tank.width/2, tank.y + tank.height/2);

            // 旋转方向
            const angles = { 'up': 0, 'right': Math.PI/2, 'down': Math.PI, 'left': -Math.PI/2 };
            ctx.rotate(angles[tank.direction]);

            // 坦克主体
            ctx.fillStyle = tank.color;
            ctx.fillRect(-tank.width/2 + 4, -tank.height/2 + 2, tank.width - 8, tank.height - 4);

            // 履带
            ctx.fillStyle = '#333';
            ctx.fillRect(-tank.width/2, -tank.height/2, 6, tank.height);
            ctx.fillRect(tank.width/2 - 6, -tank.height/2, 6, tank.height);

            // 炮塔
            ctx.fillStyle = isPlayer ? '#00cc00' : '#cc0000';
            ctx.beginPath();
            ctx.arc(0, 0, tank.width/4, 0, Math.PI * 2);
            ctx.fill();

            // 炮管
            ctx.fillStyle = isPlayer ? '#009900' : '#990000';
            ctx.fillRect(-3, -tank.height/2 - 5, 6, tank.height/2);

            ctx.restore();
        }

        // 绘制子弹
        function drawBullet(bullet) {
            ctx.fillStyle = bullet.isPlayer ? '#ffff00' : '#ff6600';
            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // 绘制爆炸
        function drawExplosion(exp) {
            const alpha = 1 - exp.frame / exp.maxFrame;
            const size = 20 + exp.frame * 3;

            ctx.save();
            ctx.globalAlpha = alpha;

            // 外圈
            ctx.fillStyle = '#ff6600';
            ctx.beginPath();
            ctx.arc(exp.x, exp.y, size, 0, Math.PI * 2);
            ctx.fill();

            // 内圈
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(exp.x, exp.y, size * 0.6, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // 创建敌人
        function spawnEnemy() {
            if (enemies.length >= MAX_ENEMIES || spawnedEnemies >= totalEnemies) return;

            const spawnPoints = [
                { x: 0, y: 0 },
                { x: 380, y: 0 },
                { x: 764, y: 0 }
            ];

            const spawn = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];

            enemies.push({
                x: spawn.x,
                y: spawn.y,
                width: 36,
                height: 36,
                speed: 1.5 + level * 0.2,
                direction: 'down',
                color: '#ff0000',
                lastShot: 0,
                shootDelay: 1500 - level * 100,
                lastDirectionChange: 0,
                directionChangeDelay: 1000
            });

            spawnedEnemies++;
            updateStats();
        }

        // 发射子弹
        function shoot(tank, isPlayer) {
            const now = Date.now();
            if (now - tank.lastShot < tank.shootDelay) return;

            tank.lastShot = now;

            const bulletSpeed = 8;
            let bx = tank.x + tank.width/2;
            let by = tank.y + tank.height/2;
            let vx = 0, vy = 0;

            switch(tank.direction) {
                case 'up': vy = -bulletSpeed; by = tank.y; break;
                case 'down': vy = bulletSpeed; by = tank.y + tank.height; break;
                case 'left': vx = -bulletSpeed; bx = tank.x; break;
                case 'right': vx = bulletSpeed; bx = tank.x + tank.width; break;
            }

            bullets.push({
                x: bx,
                y: by,
                vx: vx,
                vy: vy,
                isPlayer: isPlayer
            });
        }

        // 碰撞检测
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // 检测地图碰撞
        function checkMapCollision(x, y, width, height) {
            const left = Math.floor(x / TILE_SIZE);
            const right = Math.floor((x + width - 1) / TILE_SIZE);
            const top = Math.floor(y / TILE_SIZE);
            const bottom = Math.floor((y + height - 1) / TILE_SIZE);

            for (let ty = top; ty <= bottom; ty++) {
                for (let tx = left; tx <= right; tx++) {
                    if (ty < 0 || ty >= ROWS || tx < 0 || tx >= COLS) {
                        return true; // 边界碰撞
                    }
                    const tile = map[ty][tx];
                    if (tile === 1 || tile === 2 || tile === 4 || tile === 5) {
                        return true;
                    }
                }
            }
            return false;
        }

        // 更新玩家
        function updatePlayer() {
            let newX = player.x;
            let newY = player.y;

            if (keys['ArrowUp'] || keys['KeyW']) {
                player.direction = 'up';
                newY -= player.speed;
            }
            if (keys['ArrowDown'] || keys['KeyS']) {
                player.direction = 'down';
                newY += player.speed;
            }
            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.direction = 'left';
                newX -= player.speed;
            }
            if (keys['ArrowRight'] || keys['KeyD']) {
                player.direction = 'right';
                newX += player.speed;
            }

            if (!checkMapCollision(newX, player.y, player.width, player.height)) {
                player.x = Math.max(0, Math.min(canvas.width - player.width, newX));
            }
            if (!checkMapCollision(player.x, newY, player.width, player.height)) {
                player.y = Math.max(0, Math.min(canvas.height - player.height, newY));
            }

            if (keys['Space'] || keys['KeyJ']) {
                shoot(player, true);
            }
        }

        // 更新敌人
        function updateEnemies() {
            const now = Date.now();

            enemies.forEach(enemy => {
                // AI移动
                if (now - enemy.lastDirectionChange > enemy.directionChangeDelay) {
                    const directions = ['up', 'down', 'left', 'right'];
                    enemy.direction = directions[Math.floor(Math.random() * directions.length)];
                    enemy.lastDirectionChange = now;
                }

                let newX = enemy.x;
                let newY = enemy.y;

                switch(enemy.direction) {
                    case 'up': newY -= enemy.speed; break;
                    case 'down': newY += enemy.speed; break;
                    case 'left': newX -= enemy.speed; break;
                    case 'right': newX += enemy.speed; break;
                }

                if (!checkMapCollision(newX, newY, enemy.width, enemy.height)) {
                    enemy.x = Math.max(0, Math.min(canvas.width - enemy.width, newX));
                    enemy.y = Math.max(0, Math.min(canvas.height - enemy.height, newY));
                } else {
                    enemy.lastDirectionChange = 0; // 碰到障碍物改变方向
                }

                // 随机射击
                if (Math.random() < 0.02) {
                    shoot(enemy, false);
                }
            });
        }

        // 更新子弹
        function updateBullets() {
            bullets = bullets.filter(bullet => {
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;

                // 边界检测
                if (bullet.x < 0 || bullet.x > canvas.width ||
                    bullet.y < 0 || bullet.y > canvas.height) {
                    return false;
                }

                // 地图碰撞
                const tileX = Math.floor(bullet.x / TILE_SIZE);
                const tileY = Math.floor(bullet.y / TILE_SIZE);

                if (tileX >= 0 && tileX < COLS && tileY >= 0 && tileY < ROWS) {
                    const tile = map[tileY][tileX];
                    if (tile === 1) { // 砖墙
                        map[tileY][tileX] = 0;
                        createExplosion(bullet.x, bullet.y);
                        return false;
                    }
                    if (tile === 2) { // 钢墙
                        createExplosion(bullet.x, bullet.y);
                        return false;
                    }
                    if (tile === 5) { // 基地
                        gameOver();
                        return false;
                    }
                }

                // 玩家子弹打敌人
                if (bullet.isPlayer) {
                    for (let i = enemies.length - 1; i >= 0; i--) {
                        const enemy = enemies[i];
                        if (checkCollision(
                            { x: bullet.x - 4, y: bullet.y - 4, width: 8, height: 8 },
                            enemy
                        )) {
                            enemies.splice(i, 1);
                            score += 100;
                            createExplosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2);
                            updateStats();
                            return false;
                        }
                    }
                } else {
                    // 敌人子弹打玩家
                    if (checkCollision(
                        { x: bullet.x - 4, y: bullet.y - 4, width: 8, height: 8 },
                        player
                    )) {
                        lives--;
                        createExplosion(player.x + player.width/2, player.y + player.height/2);
                        updateStats();

                        if (lives <= 0) {
                            gameOver();
                        } else {
                            // 重置玩家位置
                            player.x = 400;
                            player.y = 480;
                            player.direction = 'up';
                        }
                        return false;
                    }
                }

                return true;
            });
        }

        // 创建爆炸效果
        function createExplosion(x, y) {
            explosions.push({
                x: x,
                y: y,
                frame: 0,
                maxFrame: 15
            });
        }

        // 更新爆炸
        function updateExplosions() {
            explosions = explosions.filter(exp => {
                exp.frame++;
                return exp.frame < exp.maxFrame;
            });
        }

        // 更新统计信息
        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
            document.getElementById('enemies').textContent = totalEnemies - spawnedEnemies + enemies.length;
        }

        // 检查关卡完成
        function checkLevelComplete() {
            if (enemies.length === 0 && spawnedEnemies >= totalEnemies) {
                level++;
                totalEnemies += 2;
                spawnedEnemies = 0;
                updateStats();
                initMap();
                player.x = 400;
                player.y = 520;
            }
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        // 游戏主循环
        function gameLoop() {
            if (!gameRunning) return;

            // 清空画布
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制地图
            drawMap();

            // 更新和绘制
            updatePlayer();
            updateEnemies();
            updateBullets();
            updateExplosions();

            // 生成敌人
            if (Math.random() < 0.01) {
                spawnEnemy();
            }

            // 绘制
            enemies.forEach(enemy => drawTank(enemy, false));
            drawTank(player, true);
            bullets.forEach(drawBullet);
            explosions.forEach(drawExplosion);

            // 检查关卡
            checkLevelComplete();

            requestAnimationFrame(gameLoop);
        }

        // 开始游戏
        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');

            score = 0;
            lives = 3;
            level = 1;
            totalEnemies = 10;
            spawnedEnemies = 0;
            enemies = [];
            bullets = [];
            explosions = [];

            player.x = 400;
            player.y = 520;
            player.direction = 'up';

            initMap();
            updateStats();

            gameRunning = true;
            gameLoop();
        }

        // 重新开始
        function restartGame() {
            startGame();
        }

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // 初始化显示开始界面
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        initMap();
        drawMap();
    </script>
</body>
</html>
